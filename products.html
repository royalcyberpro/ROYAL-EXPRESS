<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#101d3b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Products Catalog | ROYAL EXPRESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royalBlue: '#1E3A8A',
                        mintGreen: '#10B981',
                        goldAmber: '#F59E0B',
                        obsidianDark: '#070D1F',
                        midnightCard: '#0F1B38',
                        midnightRaised: '#16264D',
                        cyanPulse: '#38BDF8',
                        slateMist: '#CBD5E1'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pageFadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.35); }
            50% { box-shadow: 0 0 22px 4px rgba(245, 158, 11, 0.25); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }
        @keyframes barSweep {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .anim-page {
            animation: pageFadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .anim-card {
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, border-color 0.28s ease;
        }
        .anim-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 34px -12px rgba(2, 6, 23, 0.75);
        }
        .anim-btn {
            transition: transform 0.18s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }
        .anim-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }
        .anim-btn:active {
            transform: translateY(0px) scale(0.98);
        }
        .anim-float {
            animation: floatSlow 3.6s ease-in-out infinite;
        }
        .anim-glow {
            animation: pulseGlow 2.8s infinite;
        }
        .anim-gradient-bar {
            background-size: 200% 200%;
            animation: barSweep 7s ease infinite;
        }
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            transform: translateY(-1px);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    
        /* ROYAL EXPRESS motion system */
        @keyframes royalReveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes royalShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        body{scroll-behavior:smooth}
        main,section,header,footer{animation:royalReveal .65s ease both}
        button,a,[role="button"]{transition:transform .22s ease,filter .22s ease,box-shadow .22s ease}
        button:hover,a:hover,[role="button"]:hover{filter:brightness(1.08)}
        button:active,a:active{transform:scale(.975)}
        img,video{transition:transform .35s ease,filter .35s ease}
        .anim-card:hover img{transform:scale(1.035)}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
    </style>

<style id="royal-mobile-responsive">

 .p-10{padding:1.25rem!important}.p-8{padding:1.1rem!important}.p-7{padding:1rem!important}.p-6{padding:1rem!important}

@media(max-width:420px){

</style>

</head>
<body class="bg-gradient-to-br from-obsidianDark via-midnightCard to-slate-950 text-slate-100 min-h-screen flex flex-col anim-page">
    <div class="bg-royalBlue text-white text-xs py-2.5 px-6 flex justify-between items-center shadow-sm border-b border-blue-800/70">
        <div><i class="fa-solid fa-truck-fast mr-2 text-goldAmber"></i> Helplines: +233538287760 / +233538747584</div>
        <a href="contact.html" class="hover:text-goldAmber font-semibold"><i class="fa-solid fa-headset mr-1"></i> Support Hub</a>
    </div>

    <nav class="bg-midnightCard/95 backdrop-blur-md shadow-md sticky top-0 z-40 border-b border-blue-900/70">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
            <a href="index.html" class="bg-royalBlue text-white p-2.5 rounded-xl font-black text-2xl tracking-wider shadow border border-goldAmber/30">
                ROYAL<span class="text-goldAmber">EXPRESS</span>
            </a>
            <div class="flex items-center space-x-6">
                <a href="index.html" class="text-slateMist hover:text-goldAmber font-semibold text-sm">Home</a>
                <a href="products.html" class="text-goldAmber font-extrabold text-sm">Catalog</a>
                <a href="reseller.html" class="text-slateMist hover:text-mintGreen font-semibold text-sm">Reseller Hub</a>
                <a href="contact.html" class="text-slateMist hover:text-cyanPulse font-semibold text-sm">Contact</a>
                <a href="cart.html" class="relative text-slateMist hover:text-goldAmber flex items-center">
                    <i class="fa-solid fa-cart-shopping text-2xl"></i>
                    <span class="cart-count-badge absolute -top-1 -right-1 bg-mintGreen text-slate-950 text-xs font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="flex flex-col md:flex-row gap-8">
            <aside class="w-full md:w-72 bg-midnightCard p-6 rounded-2xl border border-blue-900/70 shadow-sm shrink-0 h-fit anim-card">
                <h3 class="font-extrabold text-lg text-goldAmber mb-5 flex items-center">
                    <i class="fa-solid fa-filter mr-2"></i> Filter Catalog
                </h3>
                <div class="mb-6">
                    <label class="block text-xs font-black text-slateMist uppercase mb-2 tracking-wider">Category</label>
                    <select id="filterCategory" class="w-full p-3 border-2 border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                        <option value="ALL">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home & Kitchen">Home &amp; Kitchen</option>
                        <option value="Beauty & Care">Beauty &amp; Care</option>
                        <option value="Sports & Fitness">Sports &amp; Fitness</option>
                        <option value="Automotive">Automotive</option>
                        <option value="Gaming & Consoles">Gaming &amp; Consoles</option>
                        <option value="Cameras & Audio">Cameras &amp; Audio</option>
                        <option value="Watches & Jewelry">Watches &amp; Jewelry</option>
                        <option value="Office & Tech">Office &amp; Tech</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="block text-xs font-black text-slateMist uppercase mb-2 tracking-wider">Sort By</label>
                    <select id="filterSort" class="w-full p-3 border-2 border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                        <option value="popular">Popularity / Featured</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>
            </aside>

            <section class="flex-1">
                <div class="bg-midnightCard p-4 rounded-2xl border border-blue-900/70 shadow-sm mb-6 flex gap-3">
                    <input type="text" id="catalogSearchInput" placeholder="Search products or request custom items..." class="flex-1 border-2 border-blue-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-goldAmber font-medium bg-obsidianDark text-white placeholder-slate-400">
                    <button onclick="applyFilters()" class="bg-royalBlue text-white px-7 py-3 rounded-xl font-bold text-sm hover:bg-blue-800 shadow anim-btn">Search</button>
                </div>

                <div id="searchAlertContainer" class="hidden mb-6 p-4 rounded-2xl bg-amber-950/70 border border-goldAmber/50 text-amber-200 text-sm font-medium">
                    <i class="fa-solid fa-circle-check text-goldAmber mr-2 text-lg"></i>
                    <span id="searchAlertText">Item retrieved from Royal Central Warehouse!</span>
                </div>

                <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        </div>
    </main>

    <footer class="bg-obsidianDark text-slate-400 py-8 border-t-4 border-goldAmber mt-auto">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs">
            &copy; 2026 ROYAL EXPRESS. All rights reserved.
        </div>
    </footer>

    <script src="js/app_state.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search');
            const catParam = urlParams.get('category');
            const filter=document.getElementById('filterCategory'); const selected=filter.value; filter.innerHTML='<option value="ALL">All Categories</option>'+getRoyalCategories().map(c=>`<option value="${c}">${c}</option>`).join(''); filter.value=selected;
            if(searchParam) document.getElementById('catalogSearchInput').value = searchParam;
            if(catParam) document.getElementById('filterCategory').value = catParam;

            document.getElementById('filterCategory').addEventListener('change', applyFilters);
            document.getElementById('filterSort').addEventListener('change', applyFilters);
            applyFilters();
        });

        function applyFilters() {
            let products = getProducts();
            const category = document.getElementById('filterCategory').value;
            const sort = document.getElementById('filterSort').value;
            const search = document.getElementById('catalogSearchInput').value.trim().toLowerCase();
            const alertContainer = document.getElementById('searchAlertContainer');
            alertContainer.classList.add('hidden');

            if (search) {
                let matches = products.filter(p => p.name.toLowerCase().includes(search) || p.cat.toLowerCase().includes(search));
                if (matches.length === 0) {
                    const newDynamicProduct = {
                        id: `ROYAL-PRD-CUST-${Date.now().toString().slice(-4)}`,
                        name: search.charAt(0).toUpperCase() + search.slice(1) + " (Royal Verified)",
                        cat: category !== 'ALL' ? category : 'Electronics',
                        price: Math.floor(Math.random() * 300) + 99,
                        originalPrice: Math.floor(Math.random() * 300) + 99,
                        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
                        rating: 5.0,
                        stock: 50,
                        seller: "Royal Central Dispatch",
                        profitMargin: 0,
                        discountActive: false
                    };
                    products.unshift(newDynamicProduct);
                    saveProducts(products);
                    document.getElementById('searchAlertText').textContent = `Product "${search}" was fetched & activated directly from Royal Express Warehouse!`;
                    alertContainer.classList.remove('hidden');
                }
            }

            if (category !== 'ALL') products = products.filter(p => p.cat === category);
            if (search) products = products.filter(p => p.name.toLowerCase().includes(search) || p.cat.toLowerCase().includes(search));
            if (sort === 'low-high') products.sort((a, b) => a.price - b.price);
            if (sort === 'high-low') products.sort((a, b) => b.price - a.price);

            renderCatalog(products);
        }

        function renderCatalog(items) {
            const grid = document.getElementById('catalogGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 font-bold text-base bg-midnightCard rounded-2xl border border-blue-900">No products found.</div>`;
                return;
            }
            grid.innerHTML = items.map(p => `
                <div class="bg-midnightCard border border-blue-900/70 rounded-2xl overflow-hidden shadow-sm hover:border-goldAmber/70 flex flex-col justify-between anim-card">
                    <div>
                        <div class="relative h-52 bg-obsidianDark overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                            ${p.discountActive ? `<span class="absolute top-3 left-3 bg-rose-600 text-white text-xs px-2.5 py-1 rounded-lg font-black uppercase shadow">${p.discountName || 'Sale'}</span>` : ''}
                        </div>
                        <div class="p-5">
                            <span class="text-xs text-cyanPulse font-extrabold uppercase tracking-widest">${p.cat}</span>
                            <h3 class="font-bold text-white text-base mt-1 line-clamp-1">${p.name}</h3>
                            <div class="flex items-center mt-2 text-goldAmber text-xs font-bold">
                                <i class="fa-solid fa-star mr-1"></i> ${p.rating}
                                <span class="text-slate-400 font-normal ml-2">Stock: ${p.stock}</span>
                            </div>
                            ${p.description ? `<p class="text-xs text-slate-300 mt-2 line-clamp-3">${p.description}</p>` : ""}
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between border-t border-blue-900/60 pt-4">
                        <div>
                            ${p.discountActive ? `<span class="text-xs text-slate-400 line-through block font-bold">GH₵ ${p.originalPrice.toFixed(2)}</span>` : ''}
                            <span class="text-lg font-black text-mintGreen">GH₵ ${p.price.toFixed(2)}</span>
                        </div>
                        <button onclick="addToCartCatalog('${p.id}')" class="bg-royalBlue hover:bg-blue-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow anim-btn">
                            <i class="fa-solid fa-cart-plus mr-1"></i> Add
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCartCatalog(id) {
            const products = getProducts();
            const p = products.find(item => item.id === id);
            if (!p) return;
            let cart = getCart();
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; } else { cart.push({ ...p, qty: 1 }); }
            saveCart(cart);
            alert(`${p.name} added to cart!`);
        }
    </script>
<script id="royal-mobile-navigation">
(function(){
  if (window.matchMedia('(min-width: 769px)').matches || document.querySelector('.mobile-bottom-nav')) return;
  const links=[
    ['index.html','fa-house','Home'],
    ['products.html','fa-store','Shop'],
    ['cart.html','fa-cart-shopping','Cart'],
    ['login.html','fa-user','Account'],
    ['contact.html','fa-headset','Help']
  ];
  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  const nav=document.createElement('nav'); nav.className='mobile-bottom-nav'; nav.setAttribute('aria-label','Mobile quick navigation');
  links.forEach(([href,icon,label])=>{
    const a=document.createElement('a');a.href=href;
    if(current===href || (current==='checkout.html'&&href==='cart.html') || (current==='receipt.html'&&href==='cart.html'))a.classList.add('active');
    const i=document.createElement('i');i.className='fa-solid '+icon;i.setAttribute('aria-hidden','true');
    const span=document.createElement('span');span.textContent=label;
    a.append(i,span);nav.append(a);
  });
  document.body.append(nav);
})();
</script>
