<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#101d3b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign In &amp; Register | ROYAL EXPRESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royalBlue: '#1E3A8A',
                        mintGreen: '#10B981',
                        goldAmber: '#F59E0B',
                        obsidianDark: '#070D1F',
                        midnightCard: '#0F1B38',
                        midnightRaised: '#16264D',
                        cyanPulse: '#38BDF8',
                        slateMist: '#CBD5E1'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pageFadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.35); }
            50% { box-shadow: 0 0 22px 4px rgba(245, 158, 11, 0.25); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }
        @keyframes barSweep {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .anim-page {
            animation: pageFadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .anim-card {
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, border-color 0.28s ease;
        }
        .anim-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 34px -12px rgba(2, 6, 23, 0.75);
        }
        .anim-btn {
            transition: transform 0.18s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }
        .anim-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }
        .anim-btn:active {
            transform: translateY(0px) scale(0.98);
        }
        .anim-float {
            animation: floatSlow 3.6s ease-in-out infinite;
        }
        .anim-glow {
            animation: pulseGlow 2.8s infinite;
        }
        .anim-gradient-bar {
            background-size: 200% 200%;
            animation: barSweep 7s ease infinite;
        }
        input, select, textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            transform: translateY(-1px);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    
        /* ROYAL EXPRESS motion system */
        @keyframes royalReveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes royalShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        body{scroll-behavior:smooth}
        main,section,header,footer{animation:royalReveal .65s ease both}
        button,a,[role="button"]{transition:transform .22s ease,filter .22s ease,box-shadow .22s ease}
        button:hover,a:hover,[role="button"]:hover{filter:brightness(1.08)}
        button:active,a:active{transform:scale(.975)}
        img,video{transition:transform .35s ease,filter .35s ease}
        .anim-card:hover img{transform:scale(1.035)}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
        @keyframes authCardEnter{0%{opacity:0;transform:translateY(34px) scale(.94);filter:blur(7px)}70%{opacity:1;transform:translateY(-3px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes authFieldEnter{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
        @keyframes authHalo{0%,100%{box-shadow:0 0 18px rgba(56,189,248,.12),0 18px 55px rgba(0,0,0,.28)}50%{box-shadow:0 0 32px rgba(245,158,11,.22),0 22px 65px rgba(0,0,0,.38)}}
        #authForm,#registrationStep1,#registrationStep2{animation:authCardEnter .8s cubic-bezier(.2,.8,.2,1) both}
        #authForm input,#registrationStep1 input,#registrationStep2 input{animation:authFieldEnter .55s ease both}
        #authForm input:focus,#registrationStep1 input:focus,#registrationStep2 input:focus{transform:translateY(-2px) scale(1.012);box-shadow:0 0 0 3px rgba(56,189,248,.22),0 8px 24px rgba(56,189,248,.12)}
        #tabLogin,#tabRegister{position:relative;overflow:hidden}
        #tabLogin:hover,#tabRegister:hover{letter-spacing:.04em;text-shadow:0 0 14px rgba(245,158,11,.35)}
        #authForm button[type=submit],#registrationStep1 button[type=submit],#registrationStep2 button[type=submit]{animation:authHalo 3.4s ease-in-out infinite;transition:transform .25s ease,filter .25s ease}
        #authForm button[type=submit]:hover,#registrationStep1 button[type=submit]:hover,#registrationStep2 button[type=submit]:hover{transform:translateY(-3px) scale(1.025);filter:brightness(1.12)}
        @media(prefers-reduced-motion:reduce){#authForm,#registrationStep1,#registrationStep2,#authForm input,#registrationStep1 input,#registrationStep2 input,#authForm button[type=submit],#registrationStep1 button[type=submit],#registrationStep2 button[type=submit]{animation:none!important}}

    </style>
    <style>
        @keyframes authCardEnter {
            0% { opacity: 0; transform: translateY(28px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes formSlideIn {
            0% { opacity: 0; transform: translateX(20px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .animate-card-enter {
            animation: authCardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-form-switch {
            animation: formSlideIn 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

<body class="bg-gradient-to-br from-obsidianDark via-royalBlue/40 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-80 h-80 bg-goldAmber/15 rounded-full blur-3xl pointer-events-none anim-float"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-mintGreen/15 rounded-full blur-3xl pointer-events-none anim-float"></div>

    <div class="bg-midnightCard/95 backdrop-blur-md max-w-md w-full rounded-2xl shadow-2xl border border-blue-800/80 overflow-hidden animate-card-enter relative z-10">
        <div class="bg-royalBlue p-6 text-center text-white border-b border-blue-800">
            <a href="index.html" class="inline-block bg-obsidianDark/70 border border-goldAmber/40 px-4 py-2 rounded-xl text-2xl font-black tracking-wider text-white anim-float">

            <p class="text-xs text-blue-200 mt-2 font-medium">Customer &amp; Reseller Account Portal</p>

        <div class="p-7">

                <button id="tabLogin" onclick="switchAuthMode('login')" class="flex-1 py-2 font-bold text-sm text-goldAmber border-b-2 border-goldAmber transition-all">Sign In</button>
                <button id="tabRegister" onclick="switchAuthMode('register')" class="flex-1 py-2 font-bold text-sm text-slate-400 hover:text-white transition-all">Register Account</button>
            </div>

            <!-- Login Form -->
            <form id="authForm" class="space-y-4 animate-form-switch">
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Registered Email Address</label>
                    <input type="email" id="authEmail" required placeholder="customer@example.com" class="w-full p-3 border border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                </div>
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Password</label>
                    <input type="password" id="authPass" required placeholder="••••••••" class="w-full p-3 border border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                </div>
                <div id="loginErrorBox" class="hidden p-3 bg-rose-950/80 border border-rose-500/50 rounded-xl text-xs text-rose-200 font-bold"></div>
                <button type="submit" id="submitAuthBtn" class="w-full bg-mintGreen text-slate-950 py-3.5 rounded-xl font-extrabold shadow-lg anim-btn">
                    Sign In

            </form>

            <!-- Registration Step 1: Enter Details & Send Real Email Verification Code -->
            <form id="registerStep1Form" class="hidden space-y-4 animate-form-switch">
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Full Name</label>
                    <input type="text" id="regName" required placeholder="Isaac Bekoe" class="w-full p-3 border border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                </div>
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Email Address (One Account Per Email)</label>
                    <input type="email" id="regEmail" required placeholder="yourname@gmail.com" class="w-full p-3 border border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                </div>
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Password</label>
                    <input type="password" id="regPass" required placeholder="••••••••" class="w-full p-3 border border-blue-800 rounded-xl text-sm font-semibold outline-none focus:border-goldAmber bg-obsidianDark text-white">
                </div>
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Account Type</label>

            <!-- Registration Step 2: Check Email & Enter Exact Code -->
            <form id="registerVerifyForm" class="hidden space-y-4 animate-form-switch">
                <div id="verifBannerBox" class="p-4 bg-emerald-950/70 border border-mintGreen/40 rounded-xl text-xs text-emerald-100 space-y-2">
                    <div class="font-bold flex items-center text-mintGreen">
                        <i class="fa-solid fa-paper-plane mr-1.5"></i> Check Your Email Inbox
                    </div>
                    <p id="verifInstructionText" class="text-slate-200 leading-relaxed"></p>
                    <div id="emailDispatchStatus" class="text-[11px] font-semibold text-cyanPulse bg-obsidianDark border border-blue-800/80 rounded-lg p-2.5"></div>
                </div>
                <div>
                    <label class="block text-xs font-black text-slateMist uppercase mb-1">Enter Exact 6-Digit Code from Your Email</label>
                    <input type="text" id="verifCodeInput" required maxlength="6" placeholder="000000" class="w-full p-3 border-2 border-goldAmber rounded-xl text-center font-mono text-lg font-black tracking-widest outline-none bg-obsidianDark text-white">
                </div>
                <div id="verifErrorBox" class="hidden text-xs text-rose-400 font-bold"></div>

                    <button type="button" onclick="editRegistrationEmail()" class="text-xs text-slate-400 font-bold hover:underline">
                        Change Email

                        Resend Code to Email
                    </button>

            <div class="mt-6 pt-4 border-t border-blue-900 text-center flex justify-between items-center text-xs">

                </a>

                </a>

    <script src="js/app_state.js"></script>
    <script src="js/email_service.js"></script>
    <script>
        let pendingRegistration = null;
        let currentVerificationCode = ""; // Kept empty; verification is performed by the Cloudflare Worker.


        function replayAnim(el) {
            if (!el) return;
            el.classList.remove("animate-form-switch");
            void el.offsetWidth;
            el.classList.add("animate-form-switch");
        }

        function switchAuthMode(mode) {
            const isLogin = mode === 'login';
            document.getElementById('tabLogin').className = isLogin ? "flex-1 py-2 font-bold text-sm text-goldAmber border-b-2 border-goldAmber transition-all" : "flex-1 py-2 font-bold text-sm text-slate-400 hover:text-white transition-all";
            document.getElementById('tabRegister').className = !isLogin ? "flex-1 py-2 font-bold text-sm text-goldAmber border-b-2 border-goldAmber transition-all" : "flex-1 py-2 font-bold text-sm text-slate-400 hover:text-white transition-all";

            const loginEl = document.getElementById('authForm');
            const step1El = document.getElementById('registerStep1Form');
            const step2El = document.getElementById('registerVerifyForm');

            loginEl.classList.toggle('hidden', !isLogin);
            step1El.classList.toggle('hidden', isLogin || pendingRegistration !== null);
            step2El.classList.toggle('hidden', isLogin || pendingRegistration === null);

            if (isLogin) replayAnim(loginEl);
            else if (pendingRegistration === null) replayAnim(step1El);
            else replayAnim(step2El);
        }

        async function dispatchVerificationEmail(email, name) {
            const statusEl = document.getElementById("emailDispatchStatus");
            const sendBtn = document.getElementById("sendCodeBtn");
            if (statusEl) statusEl.textContent = `Sending verification email to ${email}...`;
            if (sendBtn) { sendBtn.disabled = true; sendBtn.classList.add('opacity-60'); }
            try {
                await sendRoyalVerificationCode(email, name);
                if (statusEl) statusEl.textContent = `A verification email was requested for ${email}. Check your Inbox and Spam folder.`;
            } catch (err) {
                if (statusEl) statusEl.textContent = `Email could not be sent: ${err.message}`;
                throw err;
            } finally {
                if (sendBtn) { sendBtn.disabled = false; sendBtn.classList.remove('opacity-60'); }
            }
        }

        document.getElementById("authForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("authEmail").value.trim().toLowerCase();
            const pass = document.getElementById("authPass").value;
            const errBox = document.getElementById("loginErrorBox");
            errBox.classList.add("hidden");

            const users = getUsers();
            const found = users.find(u => u.email.toLowerCase() === email);

            if (!found) {
                errBox.textContent = `No account found for ${email}. Please register on this published website first. Accounts stored when opening local files do not transfer to GitHub Pages.`;
                errBox.classList.remove("hidden");
                return;
            }

            if (found.pass !== pass) {
                errBox.innerHTML = `Access denied: Wrong password entered for <strong>${email}</strong>. Use <a href="forgot_password.html" class="underline text-goldAmber">Forgot Password</a> to reset it.`;
                errBox.classList.remove("hidden");
                return;
            }

            saveAuthUser(found);
            alert(`Welcome back, ${found.name}!`);
            window.location.href = found.role === 'seller' ? "reseller.html" : "index.html";
        });

        document.getElementById("registerStep1Form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim().toLowerCase();
            const pass = document.getElementById("regPass").value;
            const role = document.getElementById("regRole").value;
            const regErr = document.getElementById("regErrorBox");
            regErr.classList.add("hidden");

            const existingUsers = getUsers();
            const alreadyRegistered = existingUsers.some(u => u.email.toLowerCase() === email);
            if (alreadyRegistered) {
                regErr.innerHTML = `An account with <strong>${email}</strong> already exists! Each email can create a new account only once. Please switch to <strong>Sign In</strong>.`;
                regErr.classList.remove("hidden");
                return;
            }

            pendingRegistration = {
                id: `USR-${Date.now().toString().slice(-5)}`,
                name: name,
                email: email,
                pass: pass,
                role: role,
                date: new Date().toLocaleString()
            };

            document.getElementById("verifInstructionText").textContent = `We are requesting a 6-digit verification code for ${email}. When the request succeeds, check your Inbox and Spam folder, then enter the code below.`;
            document.getElementById("verifCodeInput").value = "";
            document.getElementById("verifErrorBox").classList.add("hidden");

            document.getElementById("registerStep1Form").classList.add("hidden");
            const step2El = document.getElementById("registerVerifyForm");
            step2El.classList.remove("hidden");
            replayAnim(step2El);

            try {
                await dispatchVerificationEmail(email, name);
            } catch (err) {
                const detail = String(err?.message || err || "Unknown email service error");
                const verifyError = document.getElementById("verifErrorBox");
                verifyError.textContent = `We could not send the code yet: ${detail}. Use Resend Code to try again, or Edit Details to return to the form.`;
                verifyError.classList.remove("hidden");
                const status = document.getElementById("emailDispatchStatus");
                if (status) status.textContent = "Email request failed. Your registration details are still here; you can retry.";
            }
        });

        function editRegistrationEmail() {
            pendingRegistration = null;
            document.getElementById("registerVerifyForm").classList.add("hidden");
            const step1El = document.getElementById("registerStep1Form");
            step1El.classList.remove("hidden");
            replayAnim(step1El);
        }

        async function resendVerificationCode() {
            if (!pendingRegistration) return;
            document.getElementById("verifErrorBox").classList.add("hidden");
            try {
                await dispatchVerificationEmail(pendingRegistration.email, pendingRegistration.name);
                alert(`A new verification email was requested for ${pendingRegistration.email}.`);
            } catch (err) {
                alert(`The verification email could not be sent: ${err.message}`);
            }
        }

        document.getElementById("registerVerifyForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const enteredCode = document.getElementById("verifCodeInput").value.trim();
            const errorBox = document.getElementById("verifErrorBox");
            const submitBtn = e.currentTarget.querySelector('button[type="submit"]');

            if (!pendingRegistration) return;
            if (!/^\d{6}$/.test(enteredCode)) {
                errorBox.textContent = "Enter the six-digit code from your email.";
                errorBox.classList.remove("hidden");
                return;
            }

            errorBox.classList.add("hidden");
            if (submitBtn) { submitBtn.disabled = true; submitBtn.classList.add("opacity-60"); }
            try {
                await verifyRoyalVerificationCode(pendingRegistration.email, enteredCode);

                let users = getUsers();
                if (users.some(u => u.email.toLowerCase() === pendingRegistration.email.toLowerCase())) {
                    errorBox.textContent = "This email already has a registered account.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                users.unshift(pendingRegistration);
                saveUsers(users);
                saveAuthUser(pendingRegistration);

                const registeredRole = pendingRegistration.role;
                const registeredName = pendingRegistration.name;
                pendingRegistration = null;
                alert(`Email verified! Welcome, ${registeredName}. You can now sign in with your email and password.`);
                window.location.href = registeredRole === 'seller' ? "reseller.html" : "index.html";
            } catch (err) {
                errorBox.textContent = err.message || "That code could not be verified. Check it and try again.";
                errorBox.classList.remove("hidden");
            } finally {
                if (submitBtn) { submitBtn.disabled = false; submitBtn.classList.remove("opacity-60"); }
            }
        });
    </script>
<script id="royal-mobile-navigation">
(function(){
  if (window.matchMedia('(min-width: 769px)').matches || document.querySelector('.mobile-bottom-nav')) return;
  const links=[
    ['index.html','fa-house','Home'],
    ['products.html','fa-store','Shop'],
    ['cart.html','fa-cart-shopping','Cart'],
    ['login.html','fa-user','Account'],
    ['contact.html','fa-headset','Help']
  ];
  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  const nav=document.createElement('nav'); nav.className='mobile-bottom-nav'; nav.setAttribute('aria-label','Mobile quick navigation');
  links.forEach(([href,icon,label])=>{
    const a=document.createElement('a');a.href=href;
    if(current===href || (current==='checkout.html'&&href==='cart.html') || (current==='receipt.html'&&href==='cart.html'))a.classList.add('active');
    const i=document.createElement('i');i.className='fa-solid '+icon;i.setAttribute('aria-hidden','true');
    const span=document.createElement('span');span.textContent=label;
    a.append(i,span);nav.append(a);
  });
  document.body.append(nav);
})();
</script>
